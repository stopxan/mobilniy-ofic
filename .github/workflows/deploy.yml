name: Deploy & Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ============================================================
  # 1. BACKEND → Railway (avtomatik deploy)
  # Railway GitHub integratsiyasi orqali avtomatik deploy qiladi
  # Bu yerda faqat test va build tekshiriladi
  # ============================================================
  backend-check:
    name: Backend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install & Build
        working-directory: backend
        run: npm install && npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

  # ============================================================
  # 2. FRONTEND → Vercel (avtomatik deploy)
  # ============================================================
  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: web
          vercel-args: '--prod'

  # ============================================================
  # 3. WINDOWS EXE → GitHub Releases
  # ============================================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web first
        working-directory: web
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Install desktop deps
        working-directory: desktop
        run: npm install
      - name: Download icon assets
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force -Path assets
          # Create a simple icon placeholder (real icon should be committed)
          if (-not (Test-Path "assets/icon.png")) {
            Invoke-WebRequest -Uri "https://via.placeholder.com/256x256/E63946/FFFFFF?text=P" -OutFile "assets/icon.png"
          }
      - name: Build Windows EXE
        working-directory: desktop
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/dist/*.exe

  # ============================================================
  # 4. ANDROID APK → GitHub Artifacts
  # ============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Build web
        working-directory: web
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Install Capacitor
        working-directory: web
        run: |
          npx cap init pizza-chain uz.pizza.chain --web-dir dist 2>/dev/null || true
          npx cap add android 2>/dev/null || true
          npx cap sync android
      - name: Build APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pizza-chain-android
          path: web/android/app/build/outputs/apk/release/*.apk
