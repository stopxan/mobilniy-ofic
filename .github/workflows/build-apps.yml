name: Build Mobile & Desktop Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  # ============================================================
  # WINDOWS EXE
  # ============================================================
  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install web deps
        working-directory: web
        run: npm install

      - name: Build web (vite only, skip tsc)
        working-directory: web
        run: node ../node_modules/vite/bin/vite.js build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build EXE
        working-directory: desktop
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pizza-Chain-Windows
          path: desktop/dist/*.exe
          retention-days: 30

  # ============================================================
  # ANDROID APK
  # ============================================================
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3

      - name: Install web deps
        working-directory: web
        run: npm install

      - name: Build web (vite only, skip tsc)
        working-directory: web
        run: node ../node_modules/vite/bin/vite.js build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Setup Capacitor Android
        working-directory: web
        run: |
          node_modules/.bin/cap add android 2>/dev/null || true
          node_modules/.bin/cap sync android

      - name: Make gradlew executable
        working-directory: web/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pizza-Chain-Android
          path: web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================
  create-release:
    name: Create Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download EXE
        uses: actions/download-artifact@v4
        with: { name: Pizza-Chain-Windows, path: release }

      - name: Download APK
        uses: actions/download-artifact@v4
        with: { name: Pizza-Chain-Android, path: release }

      - name: List release files
        run: ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          body: |
            ## 🍕 Pizza Chain ${{ github.ref_name }}

            ### ⬇️ Yuklab olish:

            | Platforma | Fayl |
            |-----------|------|
            | **Windows** | `Pizza Chain Setup*.exe` |
            | **Android** | `app-debug.apk` |

            ### 📱 Android APK o'rnatish:
            1. `app-debug.apk` ni telefoningizga yuklab oling
            2. Sozlamalar → Xavfsizlik → **Noma'lum manbalar** → Ruxsat
            3. APK faylni oching → O'rnatish

            ### 🖥️ Windows o'rnatish:
            1. `Pizza Chain Setup.exe` ni ishga tushiring
            2. O'rnatish qo'llanmasini bajaring
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
